name: Build and Test
on:
  push:
    branches:
    - main
  pull_request: null
env:
  CARGO_TERM_COLOR: always
  PKG_CONFIG_PATH: /usr/lib/pkgconfig
  PUBLIC_STELLAR_NETWORK: local
jobs:
  contract:
    name: Contracts Verification
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt
    - name: Check contract formatting
      working-directory: contracts
      run: cargo fmt --all -- --check
    - name: Build contracts
      working-directory: contracts
      run: cargo build
  build:
    name: Frontend and Integration Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v3
      with:
        path: '~/.cargo/bin/

          runner/.cargo/bin/

          ~/.cargo/registry/index/

          ~/.cargo/registry/cache/

          ~/.cargo/git/db/

          target/

          '
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    - name: Build frontend
      working-directory: frontend
      run: npm run build
    - run: rustup target add wasm32v1-none
    - name: Start Stellar Quickstart
      uses: stellar/quickstart@main
      with:
        tag: testing
        network: local
    - run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev
        pkg-config
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@v1.15.6
    - name: Check for stellar-scaffold binary
      run: "if ! command -v stellar-scaffold &> /dev/null; then\n  echo \"stellar-scaffold\
        \ not found, installing...\"\n  cargo binstall stellar-scaffold-cli\nelse\n\
        \  echo \"stellar-scaffold already installed. Clear cache to force reinstall.\"\
        \nfi\n"
    - run: npm ci
    - run: npm run lint
    - run: npx prettier . --check
    - name: Build clients before building the project
      run: STELLAR_SCAFFOLD_ENV=development stellar-scaffold build --build-clients
    - run: npm run install:contracts
    - run: npm run build
    - name: Run tests
      run: npm test --if-present

  wasm-size:
    name: Wasm Size Regression
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        targets: wasm32v1-none
    - name: Build contracts to wasm
      run: cargo build --release --target wasm32v1-none --workspace
    - name: Check wasm sizes against the recorded budget
      run: node scripts/check-wasm-size.js
